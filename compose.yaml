# OrbitGuard with PostgreSQL.
#
#   docker compose up -d --build                     # database + API on http://localhost:8000
#   docker compose run --rm cli db import            # load existing results from ./data/processed
#   docker compose run --rm cli screen --group starlink --group fengyun-1c-debris --store
#   docker compose --profile scheduler up -d         # also run the pipeline every 6 hours
#   docker compose --profile scheduler down          # stop (data persists in the pgdata volume)
#
# Secrets come from a .env file next to this one (never committed; see .env.example):
# POSTGRES_PASSWORD is required, and Compose refuses to start without it. The database
# port is not published. For a public deployment also set ORBITGUARD_PUBLIC=1 and
# ORBITGUARD_API_KEYS: the API then refuses to start with weak settings.

x-orbitguard: &orbitguard
  build: .
  image: orbitguard:latest
  environment:
    ORBITGUARD_DB_URL: postgresql+psycopg://orbitguard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}@db:5432/orbitguard
    ORBITGUARD_PUBLIC: ${ORBITGUARD_PUBLIC:-0}
    ORBITGUARD_API_KEYS: ${ORBITGUARD_API_KEYS:-}
    ORBITGUARD_TRUST_PROXY: ${ORBITGUARD_TRUST_PROXY:-0}
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orbitguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: orbitguard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbitguard -d orbitguard"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    <<: *orbitguard
    ports:
      - "8000:8000"
    volumes:
      - ./data/models:/app/data/models:ro      # trained risk model (optional)
    restart: unless-stopped

  # Automatic pipeline every 6 h: fetch -> validate -> recalibrate -> screen -> store -> drift.
  # Start with: docker compose --profile scheduler up -d
  scheduler:
    <<: *orbitguard
    command: ["orbitguard", "pipeline", "schedule", "--every-hours", "6",
              "--group", "starlink", "--group", "oneweb", "--group", "cosmos-2251-debris",
              "--group", "iridium-33-debris", "--group", "fengyun-1c-debris"]
    volumes:
      - ./data:/app/data                       # snapshot cache feeds recalibration
    stop_grace_period: 10m                     # let a running screen finish on stop
    restart: unless-stopped
    healthcheck:
      disable: true                            # no HTTP server in this container
    profiles: ["scheduler"]

  # One-off CLI jobs: `docker compose run --rm cli <command>`.
  cli:
    <<: *orbitguard
    entrypoint: ["orbitguard"]
    command: ["--help"]
    volumes:
      - ./data:/app/data                       # CelesTrak cache, results, models
    profiles: ["jobs"]

volumes:
  pgdata:
