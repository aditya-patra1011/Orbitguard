[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitguard"
version = "0.1.0"
description = "Orbital conjunction screening and ML-based collision risk assessment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "sgp4>=2.23",
    "requests>=2.31",
    "charset_normalizer>=3.0",
]

[project.optional-dependencies]
ml = ["pandas>=2.2", "scikit-learn>=1.5", "lightgbm>=4.3"]
dev = ["pytest>=8.0", "orbitguard[ml]"]

[project.scripts]
orbitguard = "orbitguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
