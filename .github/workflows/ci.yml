name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      # LightGBM needs the OpenMP runtime; install it explicitly rather than
      # relying on whatever the runner image happens to include.
      - name: System libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libgomp1

      - name: Install
        run: python -m pip install -e ".[dev]"

      # Tests that need the ESA dataset or a trained model skip themselves here:
      # the data is large and licensed separately, and never committed.
      - name: Run tests
        run: python -m pytest -q -rs

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t orbitguard:ci .

      - name: Smoke test
        run: |
          docker run -d --name og -p 8000:8000 orbitguard:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health > health.json && break
            sleep 1
          done
          cat health.json
          python3 -c "import json; d = json.load(open('health.json')); assert d['status'] == 'ok' and d['database'] == 'ok', d"
          test "$(docker exec og id -u)" = "1000"          # runs as non-root
          curl -sf "http://127.0.0.1:8000/conjunctions" | python3 -c "import json, sys; assert json.load(sys.stdin)['total'] == 0"
          curl -s -o /dev/null -w "%{http_code}" -X POST http://127.0.0.1:8000/risk/forecast \
            -H "Content-Type: application/json" \
            -d '{"events":[{"event_id":1,"cdms":[{"time_to_tca":3,"risk":-5}]}]}' | grep -qx 503   # no model in CI

      - name: Container logs
        if: always()
        run: docker logs og || true
