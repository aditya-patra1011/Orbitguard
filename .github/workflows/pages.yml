name: Publish dashboard

# Runs the pipeline every 6 hours and publishes the dashboard with the latest run to
# GitHub Pages: free for public repositories, no server to run.
# Needs Settings -> Pages -> Source: "GitHub Actions" (once).

on:
  schedule:
    - cron: "17 */6 * * *"   # off the top of the hour, when scheduled runs are delayed most
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false   # never cut a pipeline run short

jobs:
  pipeline:
    name: Pipeline and site
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      pipeline: ${{ steps.pipeline.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[api]"

      # State carried from run to run: cached snapshots (recalibration and validation
      # compare against them), the uncertainty model, and a small SQLite database with the
      # pipeline history that drift detection needs. Losing it only costs history.
      - name: Restore pipeline state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            data/models/covariance.json
            data/orbitguard.db
          key: pipeline-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pipeline-state-

      # A failed run is still published: the dashboard then shows the failure and the
      # last good data, and the workflow is marked failed at the end.
      - name: Run the pipeline
        id: pipeline
        continue-on-error: true
        run: >
          python -m orbitguard pipeline run --keep-runs 2
          --group starlink --group oneweb --group cosmos-2251-debris
          --group iridium-33-debris --group fengyun-1c-debris

      - name: Export the site
        run: python -m orbitguard export-site --out site

      - name: Save pipeline state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw
            data/models/covariance.json
            data/orbitguard.db
          key: pipeline-state-${{ github.run_id }}-${{ github.run_attempt }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: pipeline
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  status:
    name: Pipeline status
    needs: [pipeline, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the pipeline did not succeed
        if: needs.pipeline.outputs.pipeline != 'success'
        run: |
          echo "::error::The pipeline run did not succeed; the published dashboard shows why."
          exit 1
